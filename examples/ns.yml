name: 'University of Glasgow, Network Systems (H)'
author: 'Liam McManus (mcmanussliam@gmail.com)'
year: 2026

cards:
  - front: "Describe the packets exchanged when a browser first retrieves an HTTPS page over TCP."
    back: |
      1. TCP handshake: SYN → SYN+ACK → ACK.
      2. TLS handshake: ClientHello, ServerHello (+ certificate), key exchange, Finished.
      3. HTTP exchange: encrypted request and response.

      TCP provides reliability, TLS provides security, HTTP carries application data.
    hint: "TCP → TLS → HTTP"

  - front: "Why does HTTPS retrieval typically take about three RTTs?"
    back: |
      1 RTT for TCP setup, ~1 RTT for TLS handshake, ~1 RTT for HTTP request/response.
      Each step depends on the previous one.

  - front: "Give two ways to reduce HTTPS setup latency and why they are problematic."
    back: |
      - Sending data in SYN: unsafe, middlebox issues.
      - 0-RTT TLS: replay attacks, requires prior state.

  - front: "Why does TCP use a three-way handshake?"
    back: |
      To confirm bidirectional communication and synchronise sequence numbers, avoiding half-open connections.

  - front: "Why is TCP a byte-stream protocol?"
    back: |
      It provides flexible, continuous data delivery; applications define message boundaries.

  - front: "Why can recv() return different amounts of data?"
    back: |
      TCP has no message boundaries; segmentation varies with buffering and network conditions.

  - front: "Why is RTT often more important than bandwidth?"
    back: |
      Many operations require multiple round trips; latency cannot be parallelised.

  - front: "Why do clients use Happy Eyeballs?"
    back: |
      To avoid delays from slow or broken paths by trying multiple addresses in parallel.

  - front: "How does QUIC improve connection setup?"
    back: |
      Combines transport and crypto handshakes, reducing round trips.

  - front: "Why does QUIC use UDP?"
    back: |
      UDP avoids middlebox restrictions and allows flexible protocol design.

  - front: "Why might QUIC fail?"
    back: |
      UDP may be blocked by firewalls.

  - front: "Why is 0-RTT risky?"
    back: |
      Data can be replayed by attackers.

  - front: "Why is it hard to deploy new transport protocols?"
    back: |
      Middleboxes block unknown protocols, causing ossification.

  - front: "What is protocol ossification?"
    back: |
      Network devices enforce old protocol behaviour, preventing evolution.

  - front: "How does GREASE help?"
    back: |
      Forces implementations to tolerate unknown values, preserving flexibility.

  - front: "Why does TCP suffer head-of-line blocking?"
    back: |
      Data must be delivered in order; loss delays subsequent data.

  - front: "How does QUIC avoid head-of-line blocking?"
    back: |
      Uses independent streams within a connection.

  - front: "Why does TCP use slow start?"
    back: |
      To safely probe network capacity from an unknown starting point.

  - front: "Why exponential growth in slow start?"
    back: |
      Quickly finds available bandwidth.

  - front: "Why switch to congestion avoidance?"
    back: |
      To avoid overshooting capacity and causing congestion.

  - front: "Why use AIMD?"
    back: |
      Provides stability: gradual increase, rapid decrease.

  - front: "Why does TCP use packet loss as a signal?"
    back: |
      Loss indicates congestion due to queue overflow.

  - front: "Why is ECN beneficial?"
    back: |
      Signals congestion without dropping packets, reducing latency.

  - front: "Why is bufferbloat harmful?"
    back: |
      Large queues increase latency and jitter.

  - front: "Why do delay-based algorithms detect congestion earlier?"
    back: |
      They monitor RTT increases before packet loss occurs.

  - front: "Why is fairness an issue in congestion control?"
    back: |
      Different algorithms compete unevenly for bandwidth.

  - front: "Why is UDP best-effort?"
    back: |
      No guarantees of delivery, order, or duplication.

  - front: "Why is UDP used for real-time traffic?"
    back: |
      Avoids retransmission delays and head-of-line blocking.

  - front: "Why does TCP harm real-time applications?"
    back: |
      Retransmissions and queueing increase latency.

  - front: "Why is jitter problematic?"
    back: |
      Irregular packet timing disrupts playback.

  - front: "Why is multimedia traffic bursty?"
    back: |
      Compression varies with content complexity.

  - front: "Why do streaming services buffer?"
    back: |
      To smooth playback despite network variation.

  - front: "Why does live streaming stall but pre-recorded doesn’t?"
    back: |
      Live has little buffering; pre-recorded buffers ahead.

  - front: "What happens when TCP shares a bottleneck with UDP video?"
    back: |
      TCP fills queues, increasing delay and degrading video.

  - front: "Why is DNS hierarchical?"
    back: |
      Enables scalable delegation of naming.

  - front: "Why is DNS distributed?"
    back: |
      Many servers share responsibility globally.

  - front: "Why are DNS results cached?"
    back: |
      Reduce latency and server load.

  - front: "Why does DNS lookup time vary?"
    back: |
      Cache hits vs misses and network delays.

  - front: "Why does DNS use UDP?"
    back: |
      Low overhead for small queries.

  - front: "Why fall back to TCP for DNS?"
    back: |
      Large responses or reliability.

  - front: "Why only 13 root server addresses?"
    back: |
      Protocol limits; replicated using anycast.

  - front: "What is anycast and why is it useful?"
    back: |
      Same IP at multiple locations; routes to nearest server.

  - front: "Why is DoH controversial?"
    back: |
      Hides DNS traffic inside HTTPS, bypassing controls.

  - front: "Why is DoT less controversial?"
    back: |
      Uses dedicated port, easier to manage.

  - front: "What is DNSSEC for?"
    back: |
      Ensures authenticity and integrity of DNS records.

  - front: "Why does NAT break end-to-end connectivity?"
    back: |
      It hides internal addresses and modifies packets.

  - front: "Why is NAT needed?"
    back: |
      IPv4 address exhaustion.

  - front: "Why is CGNAT problematic?"
    back: |
      Breaks inbound connections and complicates attribution.

  - front: "Why is NAT traversal complex?"
    back: |
      NAT behaviour varies and requires probing many paths.

  - front: "What are NAT traversal stages?"
    back: |
      Discovery, candidate exchange, connectivity checks.

  - front: "Why does IPv6 avoid NAT?"
    back: |
      Large address space allows global addressing.

  - front: "Why are IPv6 privacy addresses used?"
    back: |
      To prevent device tracking.

  - front: "Why doesn’t IPv6 fully solve privacy?"
    back: |
      Other identifiers still allow tracking.

  - front: "Why might BGP choose suboptimal paths?"
    back: |
      Routing is policy-based, not performance-based.

  - front: "Why is BGP vulnerable?"
    back: |
      Lacks strong built-in validation.

  - front: "What is prefix hijacking?"
    back: |
      False route advertisement to redirect traffic.

  - front: "How does RPKI help?"
    back: |
      Verifies authorised prefix origins.

  - front: "Why is BGP called path-vector?"
    back: |
      It advertises full AS paths.

  - front: "Why are CDNs used?"
    back: |
      Reduce latency and server load via caching.

  - front: "Why use DNS-based CDN redirection?"
    back: |
      Direct users to appropriate servers before connection.

  - front: "Why is DNS-based CDN selection imperfect?"
    back: |
      It lacks real-time network awareness.

  - front: "Why are CDNs good against DDoS?"
    back: |
      Distributed infrastructure absorbs attack traffic.

  - front: "Why are private networks faster than the public Internet?"
    back: |
      Optimised routing, fewer policy constraints.

  - front: "Why do many packets have size ~40 bytes or ~1500 bytes?"
    back: |
      ~40 bytes: ACKs; ~1500 bytes: Ethernet MTU.

  - front: "Why is encryption increasingly used?"
    back: |
      Protects privacy and prevents interference.

  - front: "Why is the robustness principle controversial?"
    back: |
      Accepting invalid input can entrench bad behaviour.