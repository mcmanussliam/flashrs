# yaml-language-server: $schema=https://raw.githubusercontent.com/mcmanussliam/flashrs/refs/heads/development/schema.json

name: 'University of Glasgow, Operating Systems (H)'
author: 'Liam McManus (mcmanussliam@gmail.com)'
year: 2026

cards:
  - front: "What are three challenges of using only physical addressing?"
    back: |
      Processes must be loaded into specific physical locations, making relocation difficult.
      External fragmentation is a problem because contiguous free memory is required.
      Protection and isolation are harder since addresses directly expose physical memory.

  - front: "Why is virtual addressing preferred over physical addressing?"
    back: |
      Virtual addressing gives each process its own address space, improving isolation.
      It allows relocation without modifying program addresses.
      It supports demand paging and allows programs to exceed physical memory.
      It reduces external fragmentation since memory need not be contiguous.

  - front: "What is temporal locality?"
    back: |
      Recently accessed memory locations are likely to be accessed again soon.
      This improves cache and TLB performance and reduces page faults.

  - front: "What is the effect of virtual memory on fragmentation?"
    back: |
      Paging removes external fragmentation by allowing non-contiguous allocation.
      It introduces internal fragmentation due to fixed page sizes.

  - front: "What is the trade-off in page size?"
    back: |
      Small pages reduce internal fragmentation but increase page-table size and overhead.
      Large pages reduce page-table size but increase internal fragmentation and unnecessary data transfer.

  - front: "How does larger page size affect DMA / I/O performance?"
    back: |
      Larger pages lead to fewer, larger transfers, reducing overhead and improving throughput.
      The trade-off is increased internal fragmentation.

  - front: "For a 20-bit virtual address space and 4KB pages, how many offset and page-number bits are there?"
    back: |
      4KB = 2^12 bytes, so the offset is 12 bits.
      The remaining 8 bits form the page number.
      There are 256 virtual pages.

  - front: "If a 2-level page table uses 4 bits for the top-level index out of 8 total, how many second-level tables exist?"
    back: |
      The top level has 2^4 = 16 entries.
      Therefore, there can be up to 16 second-level page tables.

  - front: "What is the main advantage of multi-level page tables?"
    back: |
      They reduce memory usage by allocating lower-level tables only for used regions.

  - front: "What do page-table metadata bits do?"
    back: |
      They store information such as valid/present, read/write/execute permissions,
      referenced/accessed status, and dirty/modified status.
      These support protection, replacement, and paging decisions.

  - front: "How does address translation work with a TLB?"
    back: |
      The CPU generates a virtual address.
      The TLB is checked for a mapping.
      On a hit, the frame is obtained immediately.
      On a miss, the page table is consulted.
      If not present, a page fault occurs.

  - front: "Why does a TLB improve effective access time?"
    back: |
      It caches page-table entries in fast memory, avoiding extra memory accesses on a hit.

  - front: "In the worst case, how does a 2-level page table affect access latency?"
    back: |
      It requires two memory accesses for page tables plus one for data,
      roughly tripling access time compared to physical addressing.

  - front: "How can multiple page sizes be supported?"
    back: |
      Page-table entries can encode page size.
      Higher levels map large regions, lower levels map smaller pages.

  - front: "What is a working set?"
    back: |
      The working set is the set of pages a process is actively using.
      If it fits in memory, performance is good; otherwise, page faults increase.

  - front: "What is thrashing?"
    back: |
      Thrashing occurs when the system spends more time swapping pages than executing,
      usually because working sets exceed available memory.

  - front: "How can CPU utilisation be improved under thrashing?"
    back: |
      Increase memory, reduce multiprogramming, or adjust paging policies
      so working sets fit in memory.

  - front: "How do Clock, LRU, and NRU differ?"
    back: |
      LRU replaces the least recently used page.
      Clock approximates LRU using a reference bit.
      NRU groups pages by referenced and modified bits.

  - front: "How does NRU choose a victim page?"
    back: |
      Pages are grouped into four classes based on referenced and modified bits.
      A page from the lowest non-empty class is selected.

  - front: "What is concurrency vs parallelism?"
    back: |
      Concurrency is multiple tasks making progress over time.
      Parallelism is tasks executing simultaneously on multiple cores.

  - front: "How does a CPU-bound multi-threaded process behave on single vs multi-core CPUs?"
    back: |
      On a single core, threads share CPU time with little speedup.
      On multiple cores, threads can execute in parallel, improving performance.

  - front: "What is a race condition?"
    back: |
      It occurs when shared data is accessed without synchronisation,
      and results depend on execution order.

  - front: "What is a critical section?"
    back: |
      A section of code accessing shared resources that must not be executed concurrently.

  - front: "What is the correct mutex pattern?"
    back: |
      lock(mutex);
      critical section;
      unlock(mutex);

  - front: "What synchronisation is used in producer-consumer problems?"
    back: |
      A mutex protects shared data.
      Condition variables or semaphores manage empty/full conditions.

  - front: "What are the four conditions for deadlock?"
    back: |
      Mutual exclusion, hold and wait, no pre-emption, circular wait.

  - front: "What is a spinlock used for?"
    back: |
      It is used for very short critical sections where waiting is cheaper than sleeping.

  - front: "How does Round Robin scheduling work?"
    back: |
      A timer interrupt enforces a time quantum.
      When it expires, the OS switches to another process.

  - front: "Why must the Round Robin quantum be chosen carefully?"
    back: |
      Too small increases context switching overhead.
      Too large reduces responsiveness.

  - front: "What factors affect choice of quantum?"
    back: |
      Context-switch cost, responsiveness, workload type, and CPU burst lengths.

  - front: "Which scheduling algorithm minimises mean turnaround time?"
    back: |
      Shortest Job First (or SRTF) minimises average turnaround time.

  - front: "What is FCFS and its weakness?"
    back: |
      Processes run in arrival order.
      The convoy effect causes short jobs to wait behind long ones.

  - front: "How is turnaround time calculated?"
    back: |
      Turnaround time = completion time − arrival time.

  - front: "What is a process?"
    back: |
      A process is a program in execution and the unit of scheduling.

  - front: "What states can a process be in?"
    back: |
      Running, waiting, sleeping, stopped, zombie.

  - front: "What does a PCB store?"
    back: |
      PID, state, priority, parent, and thread information.

  - front: "What is a context switch?"
    back: |
      Saving and restoring CPU state to switch between threads.

  - front: "What is the purpose of scheduling?"
    back: |
      To manage execution order and improve performance and responsiveness.

  - front: "What are scheduling metrics?"
    back: |
      CPU utilisation, throughput, turnaround time, waiting time, response time.

  - front: "What is virtual memory?"
    back: |
      It provides an abstraction of a large, contiguous memory space.

  - front: "What does the MMU do?"
    back: |
      It translates virtual addresses into physical addresses.

  - front: "How is memory structured in paging?"
    back: |
      Memory is divided into pages and frames, mapped via page tables.

  - front: "What is a page fault?"
    back: |
      Occurs when a required page is not in memory and must be loaded from disk.

  - front: "What is swapping?"
    back: |
      Moving pages between RAM and disk to free memory.

  - front: "What is demand paging?"
    back: |
      Pages are loaded only when needed.

  - front: "What is a TLB?"
    back: |
      A cache of page-table entries to speed up address translation.

  - front: "Why are buffers used in I/O?"
    back: |
      They handle speed mismatch between CPU and I/O,
      reduce overhead, and allow batching of transfers.

  - front: "What is DMA?"
    back: |
      Direct memory access allows devices to transfer data without CPU involvement.

  - front: "What is a filesystem?"
    back: |
      A system for organising and accessing data on storage devices.

  - front: "What is i-node indirection?"
    back: |
      i-nodes use direct and indirect pointers to reference data blocks,
      allowing efficient access for small files and scalability for large files.

  - front: "What is a distributed system?"
    back: |
      A collection of connected nodes that share resources and computation.

  - front: "How does the OS support networking?"
    back: |
      It manages network hardware and provides socket-based communication.

  - front: "What is the principle of least privilege?"
    back: |
      Only the minimum permissions necessary should be granted to reduce risk.

  - front: "What is a buffer overflow attack?"
    back: |
      Writing beyond allocated memory, potentially causing crashes or code execution.

  - front: "What is a denial-of-service attack?"
    back: |
      Overloading a system to prevent legitimate access.
